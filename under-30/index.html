        <a class="u30-pill" href="../index.html" style="padding: 12px 22px; border-radius: 999px; background: #222220; border: 1px solid #333230; color: #f3f1ec; text-decoration: none; font-weight: 600; font-size: 15px">Back to portfolio</a>

      <div style="width: 100%; margin-top: 88px; padding-top: 24px; border-top: 1px solid #2e2d2a; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 14px; color: #8f8c85">

      return Object.assign({}, c, {

        chip: 'padding: 5px 12px; border-radius: 999px; font: 600 13px Inter, sans-serif; letter-spacing: .02em; background: ' + c.accent + '; color: ' + c.chipInk,
        sample: 'font-family: ' + c.font + '; font-weight: ' + c.weight + '; font-style: ' + (c.italic ? 'italic' : 'normal') + '; text-transform: ' + (c.upper ? 'uppercase' : 'none') + '; font-size: 42px; line-height: 0.98; letter-spacing: -0.02em; color: ' + c.ink,
        swatches: c.sw.map(function (s) { return { style: 'width: 16px; height: 16px; border-radius: 50%; border: 2px solid ' + c.ink + '; background: ' + s }; })
      });
    });
    return {
      filters: filters,
      shown: shown,
      rules: [
        { n: '01', title: 'Timer on, no excuses', body: 'From blank brief to finished landing page in under 30 minutes. No going back to polish later.' },
        { n: '02', title: 'A new look every time', body: 'Each concept gets its own fonts, colors and mood — nothing reused from the round before.' },
        { n: '03', title: 'It has to really work', body: 'Real buttons, readable contrast and layouts that hold up on a phone. Interaction wherever it adds something.' }
      ]
    };
  }
