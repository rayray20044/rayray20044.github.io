<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volta Ø1 — electric car launch</title>
<meta name="description" content="Under 30 — seven web design concepts by Rayan Alloush, each designed in under 30 minutes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&amp;family=Inter:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#050607}
a{color:#E9F7FA}a:hover{color:#3DF2FF}
*{box-sizing:border-box}
@keyframes vt-grid{from{background-position:0 0}to{background-position:0 80px}}
@keyframes vt-draw{from{stroke-dashoffset:3200}to{stroke-dashoffset:0}}
@keyframes vt-spin{to{transform:rotate(360deg)}}
@keyframes vt-sweep{0%{background-position:-200% 0}60%,100%{background-position:200% 0}}
@keyframes vt-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes vt-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes vt-border{to{transform:rotate(360deg)}}
.vt-grid{animation:vt-grid 1.2s linear infinite}
.vt-draw{stroke-dasharray:3200;animation:vt-draw 3.2s ease-out forwards}
.vt-spin{transform-box:fill-box;transform-origin:center;animation:vt-spin .9s linear infinite}
.vt-sweep{background:linear-gradient(100deg,#E9F7FA 40%,#3DF2FF 50%,#E9F7FA 60%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:vt-sweep 4.5s ease-in-out infinite}
.vt-float{animation:vt-float 4s ease-in-out infinite}
.vt-pulse{animation:vt-pulse 2.4s ease-in-out infinite}
.vt-card{position:relative;overflow:hidden;border-radius:20px;padding:1px}
.vt-card::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 70%,#3DF2FF 85%,transparent 100%);animation:vt-border 6s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.vt-draw{stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<div style="font-family: Inter, system-ui, sans-serif; background: #050607; color: #E9F7FA; width: 100%; overflow: hidden">

  <header style="position: relative; z-index: 2; max-width: 1360px; margin: 0 auto; padding: 24px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px">
    <a href="#top" style="font-family: 'Chakra Petch', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: 6px; text-decoration: none">VOLTA</a>
    <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 32px; font-family: 'Chakra Petch', sans-serif; font-size: 14px; letter-spacing: 2px; text-transform: uppercase">
      <a href="#specs" style="text-decoration: none">Performance</a>
      <a href="#config" style="text-decoration: none">Configure</a>
      <a href="#tech" style="text-decoration: none">Technology</a>
    </nav>
    <a href="#config" style="min-height: 46px; padding: 0 22px; display: inline-flex; align-items: center; border: 1px solid #3DF2FF; color: #3DF2FF; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; font-size: 14px; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px)">Reserve</a>
  </header>

  <section id="top" style="position: relative; min-height: 860px; display: flex; flex-direction: column; align-items: center; padding: 56px 24px 0">
    <p class="vt-pulse" style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-size: 14px; letter-spacing: 6px; color: #3DF2FF">● WORLD PREMIERE — 2027</p>
    <h1 class="vt-sweep" style="margin: 18px 0 0; text-align: center; font-family: 'Chakra Petch', sans-serif; font-size: clamp(64px, 10vw, 156px); font-weight: 700; line-height: 0.9; letter-spacing: -2px; text-transform: uppercase">Volta Ø1</h1>
    <p style="margin: 22px 0 0; max-width: 560px; text-align: center; font-size: 19px; line-height: 1.55; color: #A9B8BD">A fully electric grand tourer shaped by the wind tunnel, not the showroom. One motor per wheel, zero compromise.</p>

    <div aria-hidden="true" style="position: absolute; left: -20%; right: -20%; bottom: 0; height: 420px; perspective: 520px; overflow: hidden">
      <div class="vt-grid" style="position: absolute; inset: 0 0 -40% 0; transform: rotateX(68deg); transform-origin: center top; background-image: linear-gradient(rgba(61,242,255,0.35) 1px, transparent 1px), linear-gradient(90deg, rgba(61,242,255,0.35) 1px, transparent 1px); background-size: 80px 80px"></div>
      <div style="position: absolute; inset: 0; background: linear-gradient(#050607 0%, rgba(5,6,7,0) 45%, rgba(5,6,7,0) 70%, #050607 100%)"></div>
    </div>

    <div class="vt-float" style="position: relative; z-index: 1; width: min(1000px, 100%); margin-top: auto; margin-bottom: 70px">
      <div aria-hidden="true" style="{{underGlow}}"></div>
      <svg role="img" aria-label="Side profile of the Volta Ø1 in {{paint.name}}" viewBox="0 0 900 300" style="width: 100%; height: auto; display: block; position: relative">
        <path d="M60 210 C60 182 92 170 150 165 L300 120 C360 95 470 90 560 100 L700 140 C780 150 840 165 850 195 L850 215 C850 225 842 230 830 230 L760 230 A70 70 0 0 0 620 230 L300 230 A70 70 0 0 0 160 230 L80 230 C66 230 60 222 60 210 Z" style="{{bodyFill}}"></path>
        <path class="vt-draw" d="M60 210 C60 182 92 170 150 165 L300 120 C360 95 470 90 560 100 L700 140 C780 150 840 165 850 195 L850 215 C850 225 842 230 830 230 L760 230 A70 70 0 0 0 620 230 L300 230 A70 70 0 0 0 160 230 L80 230 C66 230 60 222 60 210 Z" fill="none" stroke="#3DF2FF" stroke-width="2.5"></path>
        <path d="M322 130 L392 107 C452 99 520 99 560 109 L640 146 L332 152 Z" fill="#0B1418" stroke="#3DF2FF" stroke-opacity="0.6" stroke-width="1.5"></path>
        <path d="M455 102 L462 150" stroke="#3DF2FF" stroke-opacity="0.5" stroke-width="1.5"></path>
        <path d="M150 190 L840 190" stroke="#E9F7FA" stroke-opacity="0.18" stroke-width="1"></path>
        <rect class="vt-pulse" x="792" y="172" width="54" height="5" rx="2.5" fill="#E9F7FA"></rect>
        <rect class="vt-pulse" x="64" y="186" width="34" height="5" rx="2.5" fill="#FF3D6E"></rect>
        <g>
          <circle cx="230" cy="230" r="56" fill="#0A0D0F" stroke="#3DF2FF" stroke-width="2"></circle>
          <g class="vt-spin"><circle cx="230" cy="230" r="38" fill="none" stroke="#5B6A70" stroke-width="3"></circle><path d="M230 192 L230 268 M192 230 L268 230 M203 203 L257 257 M257 203 L203 257" stroke="#8A9AA0" stroke-width="3"></path></g>
          <circle cx="230" cy="230" r="8" fill="#3DF2FF"></circle>
        </g>
        <g>
          <circle cx="690" cy="230" r="56" fill="#0A0D0F" stroke="#3DF2FF" stroke-width="2"></circle>
          <g class="vt-spin"><circle cx="690" cy="230" r="38" fill="none" stroke="#5B6A70" stroke-width="3"></circle><path d="M690 192 L690 268 M652 230 L728 230 M663 203 L717 257 M717 203 L663 257" stroke="#8A9AA0" stroke-width="3"></path></g>
          <circle cx="690" cy="230" r="8" fill="#3DF2FF"></circle>
        </g>
      </svg>
    </div>
  </section>

  <section id="specs" style="border-top: 1px solid #13232A; border-bottom: 1px solid #13232A; background: #07090A">
    <div style="max-width: 1360px; margin: 0 auto; padding: 0 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr))">
      <sc-for list="{{specs}}" as="s" hint-placeholder-count="4">
        <div style="padding: 48px 28px; border-left: 1px solid #13232A; display: flex; flex-direction: column; gap: 10px">
          <span style="font-family: 'Chakra Petch', sans-serif; font-size: 13px; letter-spacing: 3px; color: #8FA3A9; text-transform: uppercase">{{s.label}}</span>
          <span style="font-family: 'Chakra Petch', sans-serif; font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -1px">{{s.value}}<span style="font-size: 22px; color: #3DF2FF; margin-left: 6px">{{s.unit}}</span></span>
        </div>
      </sc-for>
    </div>
  </section>

  <section id="config" style="max-width: 1360px; margin: 0 auto; padding: 120px 40px; display: flex; flex-wrap: wrap; align-items: center; gap: 64px">
    <div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
      <span style="font-family: 'Chakra Petch', sans-serif; font-size: 14px; letter-spacing: 4px; color: #3DF2FF">/ 02 — CONFIGURE</span>
      <h2 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-size: clamp(40px, 5vw, 68px); font-weight: 700; line-height: 1; text-transform: uppercase">Make it yours.</h2>
      <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #A9B8BD">Pick a finish and watch it come alive. Every paint is mixed with recycled ceramic pigments that shift under light.</p>
      <div role="radiogroup" aria-label="Paint finish" style="display: flex; flex-wrap: wrap; gap: 14px">
        <sc-for list="{{paints}}" as="p" hint-placeholder-count="4">
          <button role="radio" aria-checked="{{p.checked}}" aria-label="{{p.name}}" onClick="{{p.pick}}" style="{{p.swatch}}"></button>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; padding-top: 8px">
        <span style="font-family: 'Chakra Petch', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: 1px">{{paint.name}}</span>
        <span style="font-size: 15px; color: #8FA3A9">{{paint.note}}</span>
      </div>
      <a href="#config" style="align-self: flex-start; min-height: 56px; padding: 0 32px; display: inline-flex; align-items: center; background: #3DF2FF; color: #050607; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px)">Reserve yours — [Deposit]</a>
    </div>
    <div style="flex: 1 1 560px; min-width: 0; position: relative; aspect-ratio: 1.3; display: flex; align-items: center; justify-content: center">
      <div aria-hidden="true" style="{{configRing}}"></div>
      <div aria-hidden="true" style="position: absolute; width: 58%; aspect-ratio: 1; border-radius: 50%; border: 1px dashed rgba(61,242,255,0.35)"></div>
      <svg role="img" aria-label="Front three-quarter preview in {{paint.name}}" viewBox="0 0 400 260" style="width: 82%; height: auto; position: relative">
        <path d="M40 190 C40 160 70 140 120 132 L170 90 C210 70 290 70 320 90 L360 132 C380 140 380 160 380 190 L380 206 L40 206 Z" style="{{bodyFill}}"></path>
        <path d="M178 96 C215 80 285 80 314 96 L340 130 L150 130 Z" fill="#0B1418" stroke="#3DF2FF" stroke-opacity="0.6"></path>
        <path d="M60 160 L140 160 M280 160 L360 160" stroke="#E9F7FA" stroke-width="5" stroke-linecap="round" class="vt-pulse"></path>
        <path d="M150 176 L270 176" stroke="#3DF2FF" stroke-width="3" stroke-linecap="round"></path>
        <rect x="56" y="200" width="56" height="34" rx="8" fill="#0A0D0F"></rect>
        <rect x="308" y="200" width="56" height="34" rx="8" fill="#0A0D0F"></rect>
      </svg>
    </div>
  </section>

  <section id="tech" style="max-width: 1360px; margin: 0 auto; padding: 0 40px 120px; display: flex; flex-direction: column; gap: 48px">
    <h2 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-size: clamp(40px, 5vw, 68px); font-weight: 700; line-height: 1; text-transform: uppercase">Engineered <span style="color: #3DF2FF">forward.</span></h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px">
      <sc-for list="{{tech}}" as="t" hint-placeholder-count="3">
        <div class="vt-card">
          <div style="position: relative; background: #0A0E10; border-radius: 19px; padding: 36px; min-height: 300px; display: flex; flex-direction: column; gap: 16px">
            <span style="font-family: 'Chakra Petch', sans-serif; font-size: 48px; font-weight: 700; color: #3DF2FF; line-height: 1">{{t.num}}</span>
            <h3 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-size: 26px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px">{{t.title}}</h3>
            <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #A9B8BD">{{t.body}}</p>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <footer style="border-top: 1px solid #13232A">
    <div style="max-width: 1360px; margin: 0 auto; padding: 48px 40px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 20px; font-size: 14px; color: #8FA3A9">
      <span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; letter-spacing: 6px; color: #E9F7FA">VOLTA</span>
      <span>Concept design for a fictional car brand. Figures are illustrative.</span>
    </div>
  </footer>
</div>
</script>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { paint: 0 };
  }
  renderVals() {
    var self = this;
    var data = [
      { name: 'Graphite Pulse', hex: '#2A3236', glow: '61,242,255', note: 'Satin dark grey with a cyan undertone.' },
      { name: 'Solar Flare', hex: '#FF5A1F', glow: '255,90,31', note: 'Deep orange metallic that warms at sunset.' },
      { name: 'Arctic Silk', hex: '#D8E3E6', glow: '216,227,230', note: 'Pearl white, almost liquid in direct light.' },
      { name: 'Nebula Violet', hex: '#6B3DF2', glow: '107,61,242', note: 'Colour-shift violet that turns blue at an angle.' }
    ];
    var i = this.state.paint;
    var paint = data[i];
    var paints = data.map(function (p, k) {
      var on = k === i;
      return Object.assign({}, p, {
        checked: on ? 'true' : 'false',
        pick: function () { self.setState({ paint: k }); },
        swatch: 'width: 56px; height: 56px; border-radius: 50%; cursor: pointer; background: ' + p.hex + '; border: 3px solid #050607; outline: 2px solid ' + (on ? '#3DF2FF' : '#2A3A40') + '; outline-offset: 2px; transition: transform .2s; transform: scale(' + (on ? '1.12' : '1') + ')'
      });
    });
    return {
      paint: paint,
      paints: paints,
      bodyFill: 'fill: ' + paint.hex + '; transition: fill .5s; filter: drop-shadow(0 0 24px rgba(' + paint.glow + ',0.35))',
      underGlow: 'position: absolute; left: 10%; right: 10%; bottom: -10px; height: 60px; border-radius: 50%; background: rgba(' + paint.glow + ',0.45); filter: blur(40px); transition: background .5s',
      configRing: 'position: absolute; width: 78%; aspect-ratio: 1; border-radius: 50%; background: rgba(' + paint.glow + ',0.16); filter: blur(30px); transition: background .5s',
      specs: [
        { label: '0–100 km/h', value: '2.4', unit: 's' },
        { label: 'Range (target)', value: '780', unit: 'km' },
        { label: '10→80% charge', value: '11', unit: 'min' },
        { label: 'Drag coefficient', value: '0.17', unit: 'Cd' }
      ],
      tech: [
        { num: '01', title: 'Quad hub motors', body: 'A motor inside every wheel means instant torque vectoring — the car steers with power, not just the wheel.' },
        { num: '02', title: 'Solid-state pack', body: 'A thinner, lighter battery that sits flat in the floor, lowering the centre of gravity to supercar levels.' },
        { num: '03', title: 'Active aero skin', body: 'Panels along the body flex at speed, smoothing airflow and adding downforce only when it is needed.' }
      ]
    };
  }
}
</script>
